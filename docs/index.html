<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>かいものメモ</title>
<meta name="theme-color" content="#3f7d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one column, list in the middle, input bar pinned to the bottom within thumb reach */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --fg:#1f2a1c; --muted:#6b7666;
  --line:#dde3d6; --accent:#3f7d3a; --accent-ink:#ffffff; --done:#a3ad9d; --danger:#b4432f;
  --font:"Noto Sans JP","Noto Sans CJK JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141912; --surface:#1d241a; --fg:#e8eee3; --muted:#9aa594;
  --line:#2e3829; --accent:#7cc06f; --accent-ink:#0f1a0c; --done:#5d6858; --danger:#e3836f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141912; --surface:#1d241a; --fg:#e8eee3; --muted:#9aa594;
  --line:#2e3829; --accent:#7cc06f; --accent-ink:#0f1a0c; --done:#5d6858; --danger:#e3836f; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 0}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:.02em}
.count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}

main{flex:1;display:flex;flex-direction:column;gap:20px;padding-block:18px 24px}
.section-label{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.check{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:16px 14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--accent);display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0}
.name{min-width:0;overflow-wrap:anywhere;font-size:1.1rem}
li.done .box{background:var(--accent)}
li.done .box svg{opacity:1}
li.done .name{color:var(--done);text-decoration:line-through}
.del{flex:none;width:52px;align-self:stretch;background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer}
.del:active{color:var(--danger)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);line-height:1.7}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.95rem;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip:active{background:var(--accent);color:var(--accent-ink)}
.clear{align-self:flex-start;border:0;background:none;color:var(--danger);font:inherit;font-size:.95rem;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.bar{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
form{display:flex;gap:10px;max-width:560px;margin:0 auto}
input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
input:focus{outline:none;border-color:var(--accent)}
.add{flex:none;font:inherit;font-weight:700;font-size:1.05rem;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible,.check:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.confirm button{font:inherit;font-size:.95rem;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.confirm .yes{background:var(--danger);border-color:var(--danger);color:#fff}
@media (prefers-reduced-motion:no-preference){li{transition:background .15s}}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>かいものメモ</h1>
    <span class="count" id="count"></span>
  </header>

  <main>
    <section>
      <p class="section-label">買うもの</p>
      <div id="todoWrap"></div>
    </section>

    <section>
      <p class="section-label">よく買うもの（タップで追加）</p>
      <div class="chips" id="chips"></div>
    </section>

    <section id="doneSec" hidden>
      <p class="section-label">カゴに入れた</p>
      <ul id="doneList"></ul>
      <div style="margin-top:10px" id="clearArea"></div>
    </section>
  </main>

  <div class="bar">
    <form id="form" autocomplete="off">
      <input id="itemInput" type="text" placeholder="例：たまご" enterkeyhint="done" aria-label="買うものを入力">
      <button class="add" type="submit">追加</button>
    </form>
  </div>
</div>

<script>
const QUICK=["牛乳","たまご","食パン","豆腐","納豆","バナナ","お米","トイレットペーパー"];
const CHECK='<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let items=[];           // {id,name,done,createdAt}
let confirming=false;
const LS="kaimono-items";

function loadLocal(){try{items=JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){items=[]}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function row(it){
  const li=document.createElement("li");
  if(it.done) li.className="done";
  const b=document.createElement("button");
  b.className="check";b.type="button";
  b.setAttribute("aria-pressed",it.done?"true":"false");
  b.innerHTML='<span class="box">'+CHECK+'</span>';
  const n=document.createElement("span");n.className="name";n.textContent=it.name;b.appendChild(n);
  b.onclick=()=>toggle(it);
  const d=document.createElement("button");
  d.className="del";d.type="button";d.textContent="×";d.setAttribute("aria-label",it.name+"を削除");
  d.onclick=()=>remove(it);
  li.append(b,d);return li;
}

function render(){
  const sorted=[...items].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const todo=sorted.filter(i=>!i.done), done=sorted.filter(i=>i.done);
  document.getElementById("count").textContent=todo.length?`のこり ${todo.length} 点`:"";
  const tw=document.getElementById("todoWrap");tw.innerHTML="";
  if(todo.length){const ul=document.createElement("ul");todo.forEach(i=>ul.appendChild(row(i)));tw.appendChild(ul)}
  else{const e=document.createElement("div");e.className="empty";
    e.innerHTML=done.length?"ぜんぶカゴに入れました 🎉":"まだ何もありません。<br>下の入力欄に書くか、よく買うものをタップしてください。";tw.appendChild(e)}
  const ds=document.getElementById("doneSec"),dl=document.getElementById("doneList");
  ds.hidden=!done.length;dl.innerHTML="";done.forEach(i=>dl.appendChild(row(i)));
  const ca=document.getElementById("clearArea");ca.innerHTML="";
  if(done.length){
    if(confirming){
      const c=document.createElement("div");c.className="confirm";
      c.innerHTML=`<span>${done.length}点を消しますか？</span>`;
      const y=document.createElement("button");y.className="yes";y.textContent="消す";y.onclick=clearDone;
      const no=document.createElement("button");no.textContent="やめる";no.onclick=()=>{confirming=false;render()};
      c.append(y,no);ca.appendChild(c);
    }else{
      const b=document.createElement("button");b.className="clear";b.textContent="カゴに入れたものを消す";
      b.onclick=()=>{confirming=true;render()};ca.appendChild(b);
    }
  }
  const ch=document.getElementById("chips");ch.innerHTML="";
  const have=new Set(todo.map(i=>i.name));
  QUICK.filter(q=>!have.has(q)).forEach(q=>{const c=document.createElement("button");c.className="chip";c.type="button";c.textContent="＋ "+q;c.onclick=()=>add(q);ch.appendChild(c)});
}

function add(name){
  name=name.trim(); if(!name) return;
  const existing=items.find(i=>i.name===name);
  if(existing){ if(existing.done) toggle(existing); return; }
  items.push({id:newId(),name,done:false,createdAt:Date.now()});
  saveLocal();render();
}
function toggle(it){ it.done=!it.done; saveLocal(); render(); }
function remove(it){ items=items.filter(i=>i!==it); saveLocal(); render(); }
function clearDone(){ items=items.filter(i=>!i.done); confirming=false; saveLocal(); render(); }

document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();const inp=document.getElementById("itemInput");add(inp.value);inp.value="";inp.focus();
});

loadLocal();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}

</script>
</body>
</html>
